name: HealthMonitor CI Pipeline

# Powiązanie ze zdarzeniami w repozytorium (push, pull request / merge)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ==========================================
  # 1. Budowanie mikroserwisów Java (Backend)
  # ==========================================
  build-backend-java:
    name: Build Backend (Java / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Downloading code from a repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 21 configuration
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Running tests and building the application
        run: mvn clean verify -Dtest="!*PerformanceTest"

      - name: SonarQube Analysis with Quality Gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=healthmonitor-java-backend
          -Dsonar.organization=healthyteam
          -Dsonar.qualitygate.wait=true

      - name: Publishing test reports in the GitHub UI
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Test Report (JUnit)
          path: 'backend/**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Saving test reports as a CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/*.xml
            backend/**/target/surefire-reports/*.txt
          retention-days: 30

  # ==========================================
  # 2. Weryfikacja modułu Machine Learning (Python)
  # ==========================================
  build-backend-python:
    name: Check Machine Learning & Simulator (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Downloading code from a repository
        uses: actions/checkout@v4

      - name: Python configuration
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/machine-learing/requirements.txt'

      - name: Installing ML dependencies
        working-directory: ./backend/machine-learing
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: -r requirements.txt
          pip install --only-binary :all: pylint==4.1.3

      - name: Checking Python script compilation (Syntax Check)
        run: |
          python -m py_compile backend/machine-learing/*.py
          python -m py_compile backend/simulator/*.py

      - name: Static Code Analysis & Quality Gate (Pylint)
        run: |
          pylint backend/machine-learing/*.py backend/simulator/*.py --fail-under=8.0

  # ==========================================
  # 3. Budowanie aplikacji Frontend Web (Vite + React)
  # ==========================================
  build-frontend-web:
    name: Build Frontend Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-web

    steps:
      - name: Downloading code from a repository
        uses: actions/checkout@v4

      - name: Node.js configuration
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend-web/package-lock.json'

      - name: Installing dependencies
        run: npm ci

      - name: Checking code with a linter (ESLint)
        run: npm run lint --if-present

      - name: Building a web application
        run: npm run build

  # ==========================================
  # 4. Budowanie i sprawdzanie Frontend Mobile (React Native)
  # ==========================================
  build-frontend-mobile:
    name: Check Frontend Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontendMobile

    steps:
      - name: Downloading code from a repository
        uses: actions/checkout@v4

      - name: Node.js configuration
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontendMobile/package-lock.json'

      - name: Installing dependencies
        run: npm ci

      - name: Running the linter
        run: npm run lint --if-present

      - name: Running unit tests (Jest)
        run: npm test -- --watchAll=false --coverage

      - name: Saving the mobile test report as a CI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-coverage-report
          path: frontendMobile/coverage/
          retention-days: 30

  # ==========================================
  # 5. Budowanie i publikacja obrazów Docker (GHCR)
  # ==========================================
  build-and-push-docker:
    name: Build & Push Docker Images
    needs: [ build-backend-java, build-backend-python, build-frontend-web ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api-gateway
            context: ./backend/api-gateway
          - name: backend-auth
            context: ./backend/auth
          - name: backend-config
            context: ./backend/config
          - name: backend-eureka
            context: ./backend/eureka
          - name: backend-integration
            context: ./backend/integration
          - name: backend-medical-staff
            context: ./backend/medical-staff
          - name: backend-notification
            context: ./backend/notification
          - name: backend-patients
            context: ./backend/patients
          - name: backend-visits-service
            context: ./backend/visits-service
          - name: backend-vital-signs-service
            context: ./backend/vital-signs-service

          - name: backend-python
            context: ./backend/machine-learing
            
          - name: frontend-web
            context: ./frontend-web

    steps:
      - name: Downloading code from a repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=run-${{ github.run_number }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
