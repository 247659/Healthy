eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness,metrics,env,readiness,prometheus
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
    env:
      show-values: ALWAYS

  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

spring:
  rabbitmq:
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/healthmonitor-realm

logging:
  pattern:
    level: "%5p"
    correlation: "[%X{traceId:-}] [%X{spanId:-}]"